<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="description" content="联系梁洪：微信、电话与邮箱">
  <title>联系梁洪 · Liang Hong</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2317191b'/%3E%3Cpath d='M13 14h11v27h12v9H13zM37 14h11v36H37z' fill='white'/%3E%3Ccircle cx='51' cy='47' r='4' fill='%23e9544f'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#191c1d;--muted:#737a7d;--line:#e9ebea}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.container{width:min(100% - 80px,1130px);margin:auto}.header{height:95px;display:flex;align-items:center;justify-content:space-between}.brand img{display:block;width:205px}.header-actions{display:flex;align-items:center;gap:34px}.language{border:0;background:transparent;font-size:13px;font-weight:700;color:#272d2f}.back-top{font-size:13px;color:#4a4f51}.back-top:hover,.language:hover{color:#e9544f}.intro{padding:85px 0 58px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.23em;color:#899093;font-weight:700}.intro h1{font-size:clamp(42px,6.5vw,86px);letter-spacing:-.065em;line-height:1.15;margin:27px 0 20px;font-weight:800}.intro h1 span{color:#e9544f}.intro p{font-size:17px;color:#646d70;line-height:1.7;margin:0}.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin:38px 0 100px}.contact-card{min-height:275px;border-radius:15px;padding:28px;background:linear-gradient(145deg,#ffffff9c,transparent 65%),var(--tone);display:flex;flex-direction:column;align-items:flex-start}.contact-icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid #54606369;border-radius:50%;background:#ffffff75}.contact-icon svg{width:21px;height:21px;stroke:#344246;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.contact-name{font-size:13px;font-weight:700;letter-spacing:.08em;color:#505a5e;margin-top:26px}.contact-value{font-size:clamp(18px,1.8vw,25px);line-height:1.25;font-weight:800;margin-top:13px;overflow-wrap:anywhere}.contact-note{font-size:12px;color:#6f797c;margin-top:auto;padding-top:30px}.footer{border-top:1px solid var(--line);padding:32px 0 46px;font-size:11px;color:#9a9e9f;display:flex;justify-content:space-between}.footer strong{font-size:13px;color:var(--ink)}a:focus-visible,button:focus-visible{outline:2px solid #e9544f;outline-offset:4px}@media(max-width:760px){.container{width:min(100% - 36px,1130px)}.header{height:76px}.brand img{width:150px}.header-actions{gap:16px}.intro{padding:70px 0 42px}.intro p{font-size:14px}.contact-grid{grid-template-columns:1fr;margin:25px 0 65px;gap:14px}.contact-card{min-height:210px}.contact-name{margin-top:22px}.contact-note{padding-top:20px}}
  </style>
</head>
<body>
  <header class="header container"><a class="brand" href="index.html" aria-label="返回作品集首页"><img src="assets/liang-hong.svg" alt="LIANG HONG"></a><nav class="header-actions"><button class="language" id="language" type="button" aria-label="切换语言">EN / 中</button><a class="back-top" id="back-top" href="index.html">返回作品</a></nav></header>
  <main class="container"><section class="intro"><div class="eyebrow">LIANG HONG — CONTACT</div><h1 id="heading">聊聊<span>设计</span></h1><p id="intro-text">有合适的项目或想法，欢迎与我联系</p></section><section class="contact-grid" aria-label="联系方式"><article class="contact-card" style="--tone:#e3f0f7"><div class="contact-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 11.5c0 4-3.8 7-8.5 7-1 0-2-.14-2.9-.42L4.5 20l.7-3.3C3.5 15.3 2.5 13.5 2.5 11.5c0-4 3.8-7 8.5-7s8.5 3 8.5 7Z"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/></svg></div><div class="contact-name" data-zh="微信" data-en="WECHAT">微信</div><div class="contact-value" id="wechat">-Levine</div><div class="contact-note" data-zh="微信联系" data-en="Message on WeChat">微信联系</div></article><article class="contact-card" style="--tone:#edf1e7"><div class="contact-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 3.5 5.2 5.8c-.9.9-.8 2.6.3 4.7a23 23 0 0 0 8 8c2.1 1.1 3.8 1.2 4.7.3l2.3-2.3-4.1-3.4-2.4 2.1a14 14 0 0 1-5.2-5.2l2.1-2.4-3.4-4.1Z"/></svg></div><div class="contact-name" data-zh="电话" data-en="PHONE">电话</div><div class="contact-value" id="phone">+86 17603050013</div><div class="contact-note" data-zh="电话沟通" data-en="Call me">电话沟通</div></article><article class="contact-card" style="--tone:#f5eae5"><div class="contact-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg></div><div class="contact-name" data-zh="邮箱" data-en="EMAIL">邮箱</div><div class="contact-value" id="email">372430150@qq.com</div><div class="contact-note" data-zh="邮件联系" data-en="Send an email">邮件联系</div></article></section></main>
  <footer class="footer container"><strong>LIANG HONG</strong><span id="footer-text">设计作品集 · 持续更新</span></footer>
  <script>
    let lang=localStorage.getItem('portfolio-language')==='en'?'en':'zh';function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=lang==='zh'?'联系梁洪 · Liang Hong':'Contact · Liang Hong';document.querySelector('#back-top').textContent=lang==='zh'?'返回作品':'Back to work';document.querySelector('#heading').innerHTML=lang==='zh'?'聊聊<span>设计</span>':'Let’s <span>connect</span>';document.querySelector('#intro-text').textContent=lang==='zh'?'有合适的项目或想法，欢迎与我联系':'Have a project or an idea? Get in touch';document.querySelector('#footer-text').textContent=lang==='zh'?'设计作品集 · 持续更新':'Design portfolio · In progress';document.querySelectorAll('[data-zh]').forEach(el=>el.textContent=el.dataset[lang]);document.querySelectorAll('.contact-value').forEach(el=>{if(el.dataset.pending==='true'||el.textContent==='待补充'||el.textContent==='To be added'){el.dataset.pending='true';el.textContent=lang==='zh'?'待补充':'To be added'}})}document.querySelector('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('portfolio-language',lang);render()};render();
  </script>
<script defer src="assets/image-protection.js"></script><script defer src="assets/site-cursor.js?v=7"></script></body>
</html>
