const labels={zh:{all:'全部',mobile:'移动应用',web:'网页 / 工作台',dashboard:'数据大屏',device:'设备端',graphic:'平面设计'},en:{all:'All',mobile:'Mobile Apps',web:'Web & Platforms',dashboard:'Data Screens',device:'Device UI',graphic:'Graphic Design'}};

function card(p){const el=document.createElement(p.url?'a':'button');el.className='work-card';if(p.url){el.href=p.url;el.target='_blank';el.rel='noopener noreferrer'}else{el.type='button';el.onclick=()=>p.id==='rds'?openRdsModal(el):p.id==='industrialweb'?openIndustrialModal(el):p.id==='official'?openOfficialPreview(el):p.id==='jingzhen'?openJingzhenCollection(el):p.id==='drone'?openDronePreview(el):p.id==='ipanel'?openIpanelCollection(el):p.id==='hangtong'?openHangtongCollection(el):p.id==='brochure'?openBrochureCollection(el):p.id==='flyers'?openFlyerCollection(el):p.id==='exhibition'?openExhibitionCollection(el):p.id==='magazines'?openMagazineCollection(el):p.id==='standards'?openStandardsCollection(el):openPreview(p,el)}el.dataset.category=p.cat;el.dataset.project=p.id;el.dataset.mode=p.mode;el.style.setProperty('--card-bg',p.bg);el.setAttribute('aria-label',t(p.title)+'，'+t(p.sub)+(p.url?(language==='zh'?'，在新窗口打开':', opens in a new tab'):''));const imgs=p.id==='campus-3d'?`<img src="assets/campus-entry-stage.jpg" alt="园区 3D 可视化大屏" loading="lazy" decoding="async">`:p.id==='control'?`<span class="equipment-preview"><img class="equipment-machine" src="cases/equipment-control/assets/welding-robot-terminal-white.webp" alt="" loading="lazy" decoding="async"><img class="equipment-screen" src="cases/equipment-control/assets/terminal-control.webp" alt="" loading="lazy" decoding="async"></span>`:p.id==='brochure'?`<span class="brochure-card-art"><img src="assets/brochure-contents-cover.webp" alt="" loading="lazy"></span>`:p.id==='jingzhen'?`<span class="flyer-card-art"><img src="assets/jingzhen-entry-cover.jpg" alt="" loading="lazy"></span>`:p.id==='drone'?`<span class="flyer-card-art"><img src="assets/drone-pages/page-14.jpg" alt="" loading="lazy"></span>`:p.id==='ipanel'?`<span class="flyer-card-art"><img src="assets/ipanel-card/page-01.jpg" alt="" loading="lazy"></span>`:p.id==='hangtong'?`<span class="flyer-card-art"><img src="assets/hangtong-cover.jpg" alt="" loading="lazy"></span>`:p.id==='flyers'?`<span class="flyer-card-art"><img src="assets/flyer-pages/high-power/page-1.jpg" alt="" loading="lazy"></span>`:p.id==='exhibition'?`<span class="exhibition-card-art"><img src="assets/exhibition-pages/page-3.jpg" alt="" loading="lazy"></span>`:p.id==='standards'?`<span class="standards-card-art"><img src="assets/standards-pages/ppt/page-01.jpg" alt="" loading="lazy"></span>`:p.id==='magazines'?`<span class="magazine-card-art"><img src="assets/magazine-pages/issue-204/page-01.jpg" alt="" loading="lazy"></span>`:p.img.map((name,i)=>`<img src="assets/${name}.webp" alt="${t(p.title)}${p.img.length>1?' '+(i+1):''}">`).join('');el.innerHTML=`<span class="card-head"><span class="card-topline"><span class="card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5M7 5h12v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><h2>${t(p.title)}</h2><p class="subtitle">${t(p.sub)}</p></span><span class="card-media">${imgs}</span>`;return el}
function render(){document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=language==='zh'?'梁洪 · 设计作品集':'Liang Hong · Design Portfolio';document.querySelector('#hero-title').innerHTML=language==='zh'?'你好，我是<b>梁洪</b><br>十年经验，专注 UI 与产品设计':'Hi, I’m <b>Liang Hong</b><br>Ten years in UI and product design';document.querySelector('#hero-link-first').textContent='SELECTED WORKS';document.querySelector('#hero-link-second').textContent='PORTFOLIO';document.querySelector('#resume-placeholder').textContent=language==='zh'?'个人简历':'Résumé';document.querySelector('#contact-link').textContent=language==='zh'?'联系我':'Contact';document.querySelector('#footer-copy').textContent=language==='zh'?'设计作品集 · 持续更新':'Design portfolio · In progress';document.querySelector('#lang-toggle').setAttribute('aria-label',language==='zh'?'切换为英文':'Switch to Chinese');const filters=document.querySelector('#filters');filters.innerHTML='';catOrder.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c===category?' active':'');b.type='button';b.role='tab';b.setAttribute('aria-selected',c===category?'true':'false');b.textContent=labels[language][c];b.onclick=()=>{category=c;render()};filters.append(b)});const host=document.querySelector('#work-grid');host.innerHTML='';const shown=projects.filter(p=>category==='all'||p.cat===category).sort((a,b)=>catOrder.indexOf(a.cat)-catOrder.indexOf(b.cat));shown.forEach(p=>host.append(card(p)));}
function openPreview(p,trigger){selected=p;previousFocus=trigger;document.querySelector('#preview-img').src='assets/'+p.img[0]+'.webp';document.querySelector('#preview-img').alt=t(p.title);document.querySelector('#preview-kicker').textContent=t(p.tag);document.querySelector('#preview-title').textContent=t(p.title);document.querySelector('#preview-desc').textContent=t(p.desc);document.querySelector('#preview').classList.add('open');document.body.classList.add('modal-open');document.querySelector('#close-preview').focus()}
function closePreview(){document.querySelector('#preview').classList.remove('open');document.body.classList.remove('modal-open');document.querySelector('#preview-img').src='';selected=null;previousFocus?.focus()}
document.querySelector('#lang-toggle').onclick=()=>{language=language==='zh'?'en':'zh';localStorage.setItem('portfolio-language',language);render();if(selected){const p=selected;document.querySelector('#preview-kicker').textContent=t(p.tag);document.querySelector('#preview-title').textContent=t(p.title);document.querySelector('#preview-desc').textContent=t(p.desc)}};document.querySelector('#close-preview').onclick=closePreview;document.querySelector('#preview').onclick=e=>{if(e.target.id==='preview')closePreview()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected)closePreview()});render();
