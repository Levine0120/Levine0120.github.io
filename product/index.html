function openPreview(p,trigger){selected=p;previousFocus=trigger;document.querySelector('#preview-img').src='/assets/'+p.img[0]+'.webp';document.querySelector('#preview-img').alt=t(p.title);document.querySelector('#preview-kicker').textContent=t(p.tag);document.querySelector('#preview-title').textContent=t(p.title);document.querySelector('#preview-desc').textContent=t(p.desc);document.querySelector('#preview').classList.add('open');document.body.classList.add('modal-open');document.querySelector('#close-preview').focus()}
function closePreview(){document.querySelector('#preview').classList.remove('open');document.body.classList.remove('modal-open');document.querySelector('#preview-img').src='';selected=null;previousFocus?.focus()}
document.querySelector('#lang-toggle').onclick=()=>{language=language==='zh'?'en':'zh';localStorage.setItem('pm-portfolio-language',language);render();if(selected){const p=selected;document.querySelector('#preview-kicker').textContent=t(p.tag);document.querySelector('#preview-title').textContent=t(p.title);document.querySelector('#preview-desc').textContent=t(p.desc)}};document.querySelector('#close-preview').onclick=closePreview;document.querySelector('#preview').onclick=e=>{if(e.target.id==='preview')closePreview()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected)closePreview()});render();
